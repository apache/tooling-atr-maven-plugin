github:
  description: "Apache Tooling ATR Maven Plugin"
  homepage: https://apache.github.io/tooling-atr-maven-plugin/
  labels:
    - apache
    - tooling
    - atr
    - maven
    - build-management
  features:
    wiki: false
    issues: true
    projects: false
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true

  ghp_branch: gh-pages
  ghp_path: /

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
          - "gh-pages"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true

notifications:
  commits: commits@tooling.apache.org
  issues: issues@tooling.apache.org
  pullrequests: issues@tooling.apache.org

project:
  metadata:
    key: tooling-atr-maven-plugin
    committee: tooling
    name: Apache Tooling ATR Maven Plugin
    description: Maven plugin for ATR (Apache Test Release) integration to upload Apache distribution artifacts.
    short_description: Maven plugin for ATR.
    homepage: https://apache.github.io/tooling-atr-maven-plugin/
    #lifecycle_page: https://tooling.apache.org/trusted-releases.html
    #download_page: https://apache.github.io/tooling-atr-maven-plugin/download.html
    bug_database: https://apache.github.io/tooling-atr-maven-plugin/issue-management.html
    mailing_lists: https://apache.github.io/tooling-atr-maven-plugin/mailing-lists.html
    repositories:
      - https://github.com/apache/tooling-atr-maven-plugin.git
    categories:
      - build-management
    programming_languages:
      - java
  policy:
    vote_recipients:
      to: dev@tooling.apache.org
    announce_recipients:
      to: announce@apache.org
      cc:
        - dev@tooling.apache.org
    vote_mode: email
    min_hours: 72
    #license_check_mode: RAT
    source_artifact_paths:
      - "*-source-release.zip"
  features:
    atr_sync: true
